<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-section">
        <h3>{{ site.title }}</h3>
        <p>{{ site.description }}</p>
      </div>
      <div class="footer-section">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="{{ site.etsy_store }}" target="_blank">Etsy Store</a></li>
          <li><a href="{{ site.baseurl }}/#products">Our Products</a></li>
          <li><a href="{{ site.baseurl }}/#about">About Us</a></li>
          <li><a href="{{ site.baseurl }}/contact">FAQ & Contact</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>Connect</h3>
        <p>Follow us on Etsy for new releases and special offers!</p>
        <a href="{{ site.etsy_store }}" target="_blank" class="social-link">🛍️ Etsy Store</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    </div>
  </div>
</footer>
